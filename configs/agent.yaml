agent_id: "host-001"
interval: 15s

metrics:
  enabled: true
  collect: ["cpu", "memory"]

logs:
  enabled: true
  paths:
    - "/var/log/app/*.log"

access_logs:
  enabled: false
  paths:
    - "/var/log/nginx/access.log"
  format: "combined"   # or "json" for a structured request log
  # json_fields:                    # only used when format: json — override if your app uses different field names
  #   method: "method"
  #   path: "path"
  #   status: "status"
  #   duration_ms: "duration_ms"
  #   remote_addr: "remote_addr"

traces:
  enabled: true
  listen_addr: ":4319"   # OTLP/HTTP+JSON endpoint: POST /v1/traces (JSON encoding only, not binary protobuf — see traces.go)

cloud:
  aws:
    enabled: false
    region: "us-east-1"
    namespace: "AWS/EC2"
    metric_name: "CPUUtilization"
    statistic: "Average"
    dimension_name: "InstanceId"
    dimension_value: "i-0123456789abcdef0"
    access_key_id_env: "AWS_ACCESS_KEY_ID"         # name of the env var holding the key — not the key itself
    secret_access_key_env: "AWS_SECRET_ACCESS_KEY"
  gcp:
    enabled: false
    project_id: "my-gcp-project"
    metric_type: "compute.googleapis.com/instance/cpu/utilization"
    service_account_key_path: "/etc/oneagent-agent/gcp-sa.json"
  azure:
    enabled: false
    tenant_id: "00000000-0000-0000-0000-000000000000"
    client_id: "00000000-0000-0000-0000-000000000000"
    subscription_id: "00000000-0000-0000-0000-000000000000"
    resource_id: "/subscriptions/.../resourceGroups/.../providers/Microsoft.Compute/virtualMachines/vm1"
    metric_name: "Percentage CPU"
    client_secret_env: "AZURE_CLIENT_SECRET"        # name of the env var — not the secret itself

exporter:
  type: "stdout"   # "stdout" | "file" | "http" (our own JSON format) | "otlp_http" (real OTLP — use this for SigNoz or any OTLP-native backend)
  # path: "/var/log/oneagent-agent/export.jsonl"                    # file exporter
  # endpoint: "http://169.58.93.233:4318"                           # otlp_http: base URL of the OTLP receiver — no trailing /v1/... path, that's added automatically per signal type
  # headers_env:                                                    # otlp_http/http: header name -> env var holding its value (never put the key directly in this file)
  #   signoz-ingestion-key: "SIGNOZ_INGESTION_KEY"
  # batch_size: 100          # envelopes per POST before a size-triggered flush
  # flush_interval: 5s       # max time a partial batch waits before flushing
  # max_retries: 3           # retries on 5xx/network error; 4xx responses are never retried
