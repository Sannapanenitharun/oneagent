# Reloading: `systemctl reload agent-i` (or `kill -HUP <pid>`) re-reads
# this file without restarting. Applied live: logs.paths, access_logs.paths,
# the whole aggregation block, and traces.sampling / traces.stats. Everything
# else — agent_id, interval, listen_addr, exporter, which collectors are
# enabled — needs a restart, and the agent logs exactly which of your changes
# it could not apply. A file that fails to parse is reported and ignored; the
# agent keeps running on the configuration it already has.

# How this agent names itself in every signal it emits.
#
# Left empty, it is worked out at startup from the machine itself, in order:
# the EC2 instance's Name tag, then the EC2 instance id, then the hostname.
# That default is the useful one for an unattended install — a fixed value
# shipped here would make every host in a fleet report under the same name.
#
# Set it to override, when the machine should be known by something other than
# what it calls itself. Changing it needs a restart, not a reload.
agent_id: ""
interval: 15s

# Label telemetry with the EC2 instance it came from, so a backend shows this
# host as a specific instance rather than an anonymous Linux box. Adds the
# standard OTel attributes: cloud.provider, cloud.platform, cloud.account.id,
# cloud.region, cloud.availability_zone, host.type, host.image.id.
#
# Also adds host.name, the instance's Name tag — but only where the instance
# exposes tags through IMDS, which is off by default. Turn it on per instance
# at launch with --metadata-options InstanceMetadataTags=enabled, or after the
# fact with `aws ec2 modify-instance-metadata-options --instance-metadata-tags
# enabled`. Without it the tag is simply absent; nothing else changes, and the
# agent does not fall back to querying the EC2 API for it.
#
# This needs NO AWS credentials and no IAM permission. It reads the Instance
# Metadata Service at 169.254.169.254 — a link-local address reachable only
# from the instance itself, which answers only about that instance. It is not
# an AWS API integration; nothing is polled and no account is queried.
#
# On anything that is not an EC2 instance the probe fails fast and the agent
# carries on without these attributes, so it is safe to leave on everywhere.
#
# NOTE: on EC2 this sets host.id to the instance id, which the OTel conventions
# specify and which is what links the telemetry to the instance. Elsewhere
# host.id stays /etc/machine-id. A host already being monitored will therefore
# appear under a new identity the first time it reports with this enabled.
ec2_metadata:
  enabled: true
  timeout: 1s        # bounds the probe; a non-AWS host may blackhole the address

metrics:
  enabled: true
  collect: ["cpu", "memory"]

# The systemd journal — the operating system's own logs (sshd, the kernel, unit
# failures, authentication). These are not files, so the paths above cannot
# reach them: journald keeps its own compressed binary store.
#
# Off by default, the same way Datadog and Dynatrace make it opt-in, because it
# needs the agent user in the systemd-journal group. The installers add that
# group, so on a host installed by them enabling this is the only step.
#
# Read by running journalctl and parsing its JSON, rather than by linking
# libsystemd the way the commercial agents do. That would need cgo, and this
# agent ships as a single static binary with no runtime dependencies — the
# property that lets get.sh drop one file onto a host. The OpenTelemetry
# Collector's journald receiver makes the same trade.
#
# With enabled: true and journalctl missing, the agent fails to start rather
# than running without OS logs. Silently collecting nothing is the failure this
# exists to prevent.
journald:
  enabled: false
  # Limit to specific units. Empty collects the whole journal, which is usually
  # what you want — the interesting entry tends to come from a unit nobody
  # thought to list.
  # units: ["sshd.service", "kubelet.service"]
  # Drop named units. journalctl has no exclusion flag, so this is applied by
  # the agent after reading.
  # exclude_units: ["session-*.scope"]
  # Keep this syslog level and more severe: emerg, alert, crit, err, warning,
  # notice, info, debug. Empty keeps everything.
  # priority: "warning"
  # Where to start on a host with no stored position. Empty starts at the end
  # of the journal rather than replaying however much history it retains.
  # since: "-1h"
  # Position of the last entry known to have been exported, so a restart
  # resumes instead of skipping or repeating. Committed only once the exporter
  # has taken the entry — the same rule the file tailer's offsets follow.
  cursor_path: "/var/lib/agent-i/journald.cursor"

# Per-container metrics and container stdout/stderr, on a Docker host.
#
# Off by default: on a host with no containers this would learn that again every
# interval, and on one that runs them it multiplies the series count by however
# many are running. The container image ships with it on — see deploy/README.md.
#
# Metrics are read from the cgroup v2 filesystem, not from the Docker daemon.
# The socket below is used only to turn container ids into names and images; an
# unreachable socket costs you the labels, not the data. cgroup v1 hosts are
# detected and reported at startup rather than silently collecting nothing.
processes:
  # What is running on this host, rolled up BY EXECUTABLE rather than by PID.
  #
  # The rollup is the reason this is safe to turn on. A series per process is
  # how a metrics backend gets destroyed: anything that forks produces
  # thousands of PIDs an hour, each a series that receives a few points and is
  # never written to again. Ten thousand processes across forty programs is
  # forty series here.
  #
  # The cost is that it cannot tell you about one process — only about a
  # population. That is the right trade for a metric; per-instance detail
  # belongs on an event path where a record has a lifetime.
  enabled: false
  # Defaults to the top-level interval. Worth raising: a process population
  # changes far more slowly than CPU, and the scan reads one file per process.
  # interval: 60s
  # Distinct executables that get their own series. Past this the remainder is
  # SUMMED into one "(other)" bucket rather than dropped, so totals stay true.
  # max_executables: 256
  # Substring matches against the executable name. Kernel threads are the usual
  # candidates — there are hundreds and they are rarely what you are looking at.
  # exclude_names: ["kworker", "ksoftirqd", "migration"]

containers:
  enabled: false
  # Engine API socket. Mount it read-only — the agent only ever issues GETs.
  docker_endpoint: "/var/run/docker.sock"
  # Defaults to the top-level interval. Worth raising on a host running
  # hundreds of containers: their count changes far more slowly than CPU does.
  # interval: 30s
  # Substring matches against the image reference and the container name. The
  # agent's own container is always excluded and does not need listing here.
  # exclude_images: ["pause", "k8s.gcr.io/"]
  # exclude_names: ["buildkit"]
  logs:
    # Absent means on whenever containers.enabled is true.
    enabled: true
    # The json-file log driver's directory. Change it only on a host with a
    # relocated Docker data-root. A host using the journald or a remote log
    # driver has no files here, and the agent says so rather than appearing to
    # watch containers that never log.
    root: "/var/lib/docker/containers"
    # Where container stdout is read from: "auto", "file" or "api".
    #
    # The directory above is mode 0700 and owned by root, so the packaged agent
    # — which runs as its own unprivileged service account — cannot read it at
    # all. "auto" notices that and streams from the Engine API instead, which
    # needs only membership of the docker group. A containerised agent
    # bind-mounts the directory and reads the files.
    #
    # Prefer the files where they are readable: streaming costs the daemon a
    # goroutine per container and puts log delivery behind dockerd's health,
    # where the file reader keeps working through a wedged daemon. Set this
    # explicitly only to overrule the probe.
    source: "auto"

logs:
  enabled: true
  paths:
    - "/var/log/app/*.log"

  # Join continuation lines onto the record they belong to.
  #
  # Without this, one exception produces one log record per frame: a Java stack
  # trace arrives as thirty unrelated entries, in timestamp order but with no
  # way to tell which belong together. That is the single most common complaint
  # about naive log tailing, and it is worth turning on for any file written by
  # an application runtime.
  #
  # Changing any of this needs a restart — the pattern is compiled once and
  # records may be mid-assembly. The agent tells you when a reload could not be
  # applied.
  multiline:
    enabled: false
    # A regular expression matching the FIRST line of a record. Anything that
    # does not match continues the record before it.
    #
    # Match the start, not the continuation: what a record begins with is
    # predictable (a timestamp, a level), whereas what a stack trace looks like
    # varies by language, framework and locale. Anchor it with ^.
    #
    #   ISO timestamp   ^\d{4}-\d{2}-\d{2}
    #   syslog          ^[A-Z][a-z]{2} [ 0-9]\d \d{2}:\d{2}:\d{2}
    #   bare level      ^(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\b
    #
    # If this pattern never matches, every line becomes its own record and a
    # warning is logged — silence would make a typo here indistinguishable from
    # a file that simply has no exceptions in it.
    start_pattern: '^\d{4}-\d{2}-\d{2}'
    # Backstop against a pattern that does not match this file at all. On
    # reaching it the record is emitted marked "...RECORD TRUNCATED..." rather
    # than being discarded, and the rest is skipped until the next start line.
    max_lines: 500
    # How long an unfinished record waits for more lines before being emitted
    # anyway. Without this the last record in a quiet file is held forever,
    # waiting for a successor that never comes — which is exactly the stack
    # trace you were looking for.
    timeout: 2s

access_logs:
  enabled: false
  paths:
    - "/var/log/nginx/access.log"
  format: "combined"   # or "json" for a structured request log
  # json_fields:                    # only used when format: json — override if your app uses different field names
  #   method: "method"
  #   path: "path"
  #   status: "status"
  #   duration_ms: "duration_ms"
  #   remote_addr: "remote_addr"

# Shared by logs and access_logs. Both use one offset registry, so these are
# set once rather than per source.
tailing:
  # How often the globs above are re-evaluated. This is what picks up files
  # created after startup and closes the gap after a log rotation.
  scan_interval: 30s
  # How often open files are read.
  poll_interval: 500ms
  # Cap on a single line. A file with no newlines (a binary accidentally
  # matched by a glob) would otherwise buffer without bound; over-long lines
  # are cut and marked with a ...TRUNCATED... suffix.
  max_line_bytes: 262144
  # Per-file offsets, so a restart resumes where it left off instead of
  # skipping everything written while the agent was down. The directory must be
  # writable by the agent user — the installers create it and the systemd unit
  # allows it.
  #
  # Two details worth knowing, because they decide what a restart replays:
  #
  #  - An offset is recorded when a line has been ACCOUNTED FOR — delivered to
  #    the exporter's backend, absorbed into an aggregated summary, or
  #    deliberately shed because the export queue was full — not when it was
  #    read off disk. A line still queued when the process dies is therefore
  #    read again next time instead of being lost. The replay window is bounded
  #    by the export queue, not by how long a backend was down.
  #
  #  - Entries are keyed by device+inode and verified against a checksum of the
  #    file's first 1 KiB. Inodes get recycled, and without that check a new
  #    file handed a dead one's inode would be resumed at the old file's offset,
  #    silently skipping its opening lines.
  registry_path: "/var/lib/agent-i/registry.json"

# Summarise access log requests into per-interval metrics instead of shipping
# one record per HTTP request.
#
# Worth understanding before enabling: a server at 200 req/s produces ~17M
# individual records per day per host. Aggregating answers the same questions
# (how many, how slow, how many errors) with a few hundred metric points per
# interval, and the counts are exact rather than whatever survived sampling.
# What you give up is per-request detail — see keep_raw_events.
#
# Disabled by default so that upgrading does not silently change what an
# existing deployment receives. If you have access_logs enabled and are paying
# per ingested record, this is the setting to turn on.
aggregation:
  enabled: false
  interval: 60s                  # summary window
  max_contexts: 2000             # distinct (method, path, status) per window before overflow
  # DEPRECATED and ignored since latency stopped being stored as a sample.
  # Percentiles now come from a bucketed histogram whose memory is bounded by
  # its bucket count, not by a sample cap, so there is nothing for this to cap.
  # Left here so existing config files keep loading; the agent logs once at
  # startup if it is set. Safe to delete.
  # max_samples_per_context: 2048
  keep_raw_events: false         # also forward the per-request records (removes the volume benefit)

# A local web view of what this agent is collecting right now, served from
# memory on loopback. Nothing is sent anywhere and no backend is involved —
# it answers "is the agent actually collecting?" on the host, without
# waiting for data to surface in a remote backend.
#
# Open http://127.0.0.1:8088 on the host (or forward it:
# `ssh -N -L 8088:127.0.0.1:8088 user@host` and open it locally).
#
# Not enabled by config default — an existing deployment that upgrades
# should not silently start listening on a new port. It is on here, so
# fresh installs get it; add this block to an existing
# /etc/agent-i/agent.yaml to switch it on there.
# Optional bearer auth for BOTH listeners (this one and traces below) is
# enabled by setting AGENT_I_API_TOKEN in /etc/agent-i/env and restarting.
# There is no setting for it here on purpose: the token is a secret, and
# secrets never live in this file. Unset means no authentication, which is
# the default and is why both listeners bind loopback.
dashboard:
  enabled: true
  # Loopback deliberately: this endpoint has no authentication and exposes
  # this host's metrics, logs and trace contents. Binding it to a reachable
  # interface publishes all of that; the agent logs a warning if you do.
  listen_addr: "127.0.0.1:8088"
  # How much history is kept in memory. A debug window, not storage.
  retain: 15m
  # Cap on distinct (metric, label-set) combinations held. Past this, new
  # series are refused rather than evicting existing ones, and the page says
  # the view is incomplete instead of quietly showing a subset.
  max_series: 500

# Despite the name, this block configures the whole OTLP receiver, not only
# traces. One listener serves all three signals, because an SDK configured with
# OTEL_EXPORTER_OTLP_ENDPOINT — which is what auto-instrument.sh sets — sends
# every signal to one base URL:
#
#   POST /v1/traces    spans from instrumented apps
#   POST /v1/logs      application logs (accept_logs)
#   POST /v1/metrics   application metrics (accept_metrics)
#
# The block is still called "traces" because renaming it would break every
# existing config file for a cosmetic gain.
traces:
  enabled: true
  # OTLP/HTTP endpoint, accepting both JSON and binary protobuf. Loopback by
  # default: apps instrumented by auto-instrument.sh always send to localhost,
  # and a receiver on 0.0.0.0 lets anything that can reach this host inject
  # telemetry into your backend.
  listen_addr: "127.0.0.1:4319"
  # Cap on a single request body. The protobuf path must read the whole body
  # into memory before it can decode it.
  max_request_bytes: 4194304   # 4 MiB
  # Optional. Names an env var holding a bearer token clients must present as
  # "Authorization: Bearer <token>". Set this if you ever move listen_addr off
  # loopback; put the value in /etc/agent-i/env.
  # auth_token_env: "AGENT_I_TRACE_TOKEN"

  # The other two signals on this same listener. Both default to true: before
  # they existed an auto-instrumented app posted its metrics and logs here and
  # got 404s, so its traces arrived and the other two were silently lost.
  #
  # Turn one off and its path stops being served entirely — the app's exporter
  # gets a 404 for that signal, exactly as before. Worth considering for
  # metrics on a host with a large number of application series, since the
  # local dashboard retains a bounded number of them and reports the rest as
  # dropped.
  accept_logs: true
  accept_metrics: true

  # RED metrics (count, errors, latency distribution) computed over 100% of
  # spans. Computed BEFORE sampling, so these counts stay exact no matter how
  # few spans you actually forward — that is the whole reason to keep them
  # separately rather than deriving them from stored traces.
  stats:
    enabled: false
    interval: 60s
    max_contexts: 2000             # distinct (service, operation, status) per window
    # DEPRECATED and ignored — see the note under aggregation above.
    # max_samples_per_context: 2048

  # Reduce how many spans are forwarded. The decision is derived from the
  # trace ID, so a trace is kept or dropped as a whole — sampling spans
  # independently would deliver traces with holes in them.
  sampling:
    enabled: false
    rate: 1.0                      # fraction of ordinary traces kept, 0.0-1.0
    keep_errors: true              # forward error spans regardless of rate
    slow_threshold_ms: 0           # forward spans at least this slow regardless of rate (0 = off)

exporter:
  type: "stdout"   # "stdout" | "file" | "http" (our own JSON format) | "otlp_http" (real OTLP — use this for any OTLP-native backend)
  # path: "/var/log/agent-i/export.jsonl"                    # file exporter
  # A documentation address on purpose. example.com is IANA-reserved and
  # resolves to nothing anyone runs, so uncommenting this line without editing
  # it fails loudly instead of shipping this host's metrics, logs and trace
  # contents to a stranger. It previously named a real routable IP, which is
  # exactly the line an operator uncomments when switching off stdout.
  # endpoint: "http://backend.example.com:4318"                      # otlp_http: base URL of the OTLP receiver — no trailing /v1/... path, that's added automatically per signal type
  # headers_env:                                                    # otlp_http/http: header name -> env var holding its value (never put the key directly in this file)
  #   x-ingestion-key: "OTLP_INGESTION_KEY"
  # batch_size: 100          # envelopes per POST before a count-triggered flush
  # flush_interval: 5s       # max time a partial batch waits before flushing
  # max_retries: 3           # retries on 5xx/network error; 4xx responses are never retried
  #
  # Cap on the estimated encoded size of one POST. A batch is sent as soon as
  # EITHER limit is reached, because batch_size bounds the record count and
  # says nothing about the bytes: 100 syslog lines are ~20 KB, while 100
  # multi-line records — each holding up to logs.multiline.max_lines lines —
  # are orders of magnitude larger.
  #
  # This is the limit that matters, because exceeding it is unrecoverable. A
  # backend rejects an oversized request outright and retrying cannot help, so
  # the whole batch is lost; a batch that is merely too numerous still arrives.
  #
  # The default is 4 MiB, matching traces.max_request_bytes — what this agent's
  # own OTLP receiver accepts. Raise it only if your backend documents a larger
  # limit, and lower it if it documents a smaller one.
  # max_batch_bytes: 4194304
  #
  # The http and otlp_http exporters deliver on their own goroutine so a slow
  # backend cannot stall collection. These bound that buffer:
  # queue_size: 4096         # envelopes buffered before the oldest are dropped (drops are logged)
  # shutdown_timeout: 5s     # bound on the final flush attempt at SIGTERM

  # That buffer is in memory, so on its own it bounds an outage to queue_size
  # envelopes and loses everything in it on restart. The spool moves the
  # overflow to disk, which is what makes an outage or a restart survivable
  # rather than merely brief. It matters most for spans, logs and metrics
  # pushed into the OTLP receiver: unlike a tailed file or the journal, the
  # application will not offer them a second time.
  #
  # Nothing is written while the backend is keeping up — envelopes reach the
  # disk only once the queue above has overflowed, or at shutdown.
  spool:
    enabled: true
    dir: "/var/lib/agent-i/spool"
    max_bytes: 134217728     # 128 MiB; past this the oldest segment is discarded, so a backlog can never fill the disk
    segment_bytes: 8388608   # 8 MiB per file; a fully-delivered file is deleted outright, so nothing is ever rewritten
    sync_interval: 1s        # how long a written envelope may sit in the page cache before fsync — the power-loss window
